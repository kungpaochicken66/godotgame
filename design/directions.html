<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design directions</title><link rel="stylesheet" href="flow.css?v=5"><style>
.direction-switch{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}.concept{width:100%;border-radius:24px;display:block}.direction-caption{margin:16px 0;padding:20px;background:var(--panel);border-radius:20px}
.comparison-stage .concept{height:100%;object-fit:cover}.direction-b .bottom{left:auto;right:20px;top:112px;bottom:auto;width:245px}.direction-b .items{display:grid;grid-template-columns:1fr 1fr}.direction-b .catalog-title{display:block}.direction-b .hint{max-width:calc(100% - 300px)}.comparison-stage .item b{display:block;font-size:26px;margin-bottom:8px}.comparison-stage.play .items,.comparison-stage.play .catalog-title{display:none}.comparison-stage.play .bottom{top:auto;bottom:20px;width:auto}.comparison-stage.play .hint{max-width:calc(100% - 40px)}@media(max-width:700px){.direction-b .bottom{width:190px;right:12px}.direction-b .hint{max-width:calc(100% - 225px)}}
</style></head>
<body><main>
<header><div><div class="eyebrow">Our Little Town</div><h1>Design directions</h1></div><div class="header-tools"><label><span>Language</span><select id="language" aria-label="Language"><option value="en" data-no-translate>English</option><option value="zh-CN" data-no-translate>Chinese</option><option value="ja" data-no-translate>Japanese</option><option value="es" data-no-translate>Spanish</option><option value="fr" data-no-translate>French</option><option value="de" data-no-translate>German</option></select></label><a href="index.html">Back to interactive preview</a></div></header>
<nav class="direction-switch" aria-label="Design directions"><button data-direction="a" aria-pressed="true">A · A closer view</button><button data-direction="b" aria-pressed="false">B · A wider view</button></nav>
<section id="comparison"></section>
<p class="note">Concept artwork only. Direction A was selected.</p>
</main><script src="i18n.js?v=1"></script><script src="directions.js"></script></body></html>
